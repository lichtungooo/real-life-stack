# Faehrt die Tore aus docs/ARCHITEKTUR.md bei jedem Push auf den Prototyp.
#
# Disziplin ist keine Architektur: Was von Hand laufen muss, faellt in der
# dritten Woche aus. Darum prueft das hier ohne Zutun.
#
# Laeuft nur auf unserem Branch. Antons master beruehrt es nicht.
name: trustdonation Tore

on:
  push:
    branches: [trustdonation]
  pull_request:
    branches: [trustdonation]
  workflow_dispatch:

jobs:
  tore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Die Naht-Messung vergleicht mit Antons Stand und braucht darum die
          # ganze Geschichte, nicht nur den letzten Commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pnpm install --frozen-lockfile

      - name: Tor 1, Typen
        run: pnpm build

      - name: Tor 2, Regeln
        run: pnpm -r test

      # Antons Stand holen, damit die Naht-Messung eine Basis hat. Hier ist
      # origin der Fork, und dessen master traegt einen eigenen Commit: Ohne
      # das + verweigert git das Ueberschreiben, und die Messung lief bis
      # 01.10.2026 gegen den alten Fork-Stand (185 "unbenannte Naehte", jeder
      # Lauf rot, verschluckt von "|| true"). Schlaegt es fehl, soll es laut sein.
      - name: Antons Stand holen
        run: |
          git remote add upstream https://github.com/real-life-org/real-life-stack.git
          git fetch upstream +master:refs/remotes/origin/master --tags --force

      - name: Tore 3 bis 6
        run: python td-tools/pruefen.py --schnell

      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naht-bericht
          path: td-tools/berichte/
          if-no-files-found: ignore
          retention-days: 30
